<!doctype html>
<html><head><meta charset="utf-8"><style>
  /* title card — serif mark on the product's own paper, no emoji, no
     gradient; the build sha is the live build being filmed */
  html,body{margin:0;height:100%;background:#14181f}
  body{display:flex;align-items:center;justify-content:center;
    font-family:Georgia,'Times New Roman',serif;color:#f2f4f8}
  .box{text-align:center}
  h1{font-size:120px;font-weight:400;letter-spacing:.01em;margin:0}
  h1 .dot{color:#2dd4bf}
  .sub{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:21px;letter-spacing:.28em;text-transform:uppercase;
    color:#8a93a3;margin-top:26px}
  .sha{position:fixed;right:36px;bottom:26px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:15px;color:#5a6472}
</style></head><body>
  <div class="box">
    <h1>ALive<span class="dot">·</span>108</h1>
    <div class="sub">exposure-aware routing · Delhi NCR</div>
  </div>
  <div class="sha">live build @@BUILD@@</div>
</body></html>
