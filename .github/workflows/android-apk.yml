name: android-apk

on:
  workflow_dispatch:
  push:
    paths:
      - 'Mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JS deps
        working-directory: Mobile
        run: npm ci

      # gradle assembleRelease (not `expo run:android --variant release`):
      # expo run:android tries to install+launch on a device and fails on CI
      # runners that have no emulator; assembleRelease is build-only.
      # Debug APK is signed with the debug key -> installable proof.
      # Release APK is unsigned -> documents the signing gap.
      - name: Assemble APKs
        working-directory: Mobile/android
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            Mobile/android/app/build/outputs/apk/debug/app-debug.apk
            Mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
